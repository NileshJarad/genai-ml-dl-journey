[project]
name = "genai-ml-dl-journey"
version = "0.1.0"
description = "A comprehensive learning journey through Generative AI, Machine Learning, and Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"